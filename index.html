<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundPulse - Stream Endless Music</title>
    <meta name="description"
        content="SoundPulse - Listen to trending music online. High quality streaming, custom playlists, and unlimited beats.">
    <link rel="icon" href="Assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">
</head>

<body>
    <div class="navbar flex align-items-center">
        <div class="logo pointer">
            <img src="Assets/logo.svg" alt="SoundPulse Logo" class="brand-logo-img">
        </div>

        <div class="homeSearchFlex flex">
            <div class="home pointer">
                <img src="Assets/home.svg" alt="Home" class="nav-icon">
            </div>

            <div class="searchBox flex">
                <div class="search pointer">
                    <img src="Assets/search.svg" alt="Search" class="nav-icon">
                </div>
                <input type="text" placeholder="Search songs, artists, playlists...">
                <div class="browse pointer">
                    <img src="Assets/browse.svg" alt="Browse" class="nav-icon">
                </div>
            </div>
        </div>

        <div class="buttons1 flex justify-center align-items-center">
            <button class="btn Premium">Pulse Pro</button>
            <button class="btn Support">Support</button>
            <button class="btn Download">App</button>
        </div>

        <div class="buttons2 flex align-items-center justify-center">
            <div class="divider"></div>
            <div class="installBtn flex justify-center align-items-center">
                <div class="installSign">
                    <img src="Assets/download.svg" alt="Install" class="nav-icon small">
                </div>
                <button class="install btn">Get App</button>
            </div>

            <div class="signupBtn">
                <button class="btn signup">Sign up</button>
            </div>

            <div class="loginBtn">
                <button class="login pointer">Log in</button>
            </div>
        </div>
    </div>


    <div class="container flex">
        <div class="left rounded bg-black">

            <div class="library flex align-items-center">
                <div class="lib-title flex align-items-center gap-2">
                    <span class="lib-icon">⚡</span>
                    <h2>Your Library</h2>
                </div>
                <div class="plus pointer">
                    <img src="Assets/plus.svg" alt="Add" class="nav-icon small">
                </div>
            </div>

            <div class="songList">
                <ul>
                    <!-- Populated dynamically -->
                </ul>
            </div>

            <footer class="LibFooter">
                <div class="language flex justify-center">
                    <img src="Assets/language.svg" alt="Language" class="nav-icon small">
                    <span class="English">English</span>
                </div>
            </footer>
        </div>

        <div class="right rounded bg-black">

            <div class="headBar flex">
                <img class="hamBurger" src="Assets/hamburger.svg" alt="Menu">
                <h2>Featured Playlists</h2>
                <p class="pointer">See All</p>
            </div>

            <div class="cardContainer flex justify-center">
                <!-- Cards populated dynamically -->
            </div>
        </div>
    </div>


    <section>
        <div class="playBar flex">
            <div class="songInfo">
                <!-- Song info dynamically updated -->
            </div>

            <div class="buttonsBarFlex flex">
                <div class="playButtons flex">
                    <div class="previous button">
                        <img id="prevPB" src="Assets/previous.svg" alt="Previous">
                    </div>
                    <div class="play button">
                        <img id="playPB" src="Assets/play.svg" alt="Play/Pause">
                    </div>
                    <div class="next button">
                        <img id="nextPB" src="Assets/next.svg" alt="Next">
                    </div>
                </div>

                <div class="belowBar">
                    <div class="songCurrentTime">00:00</div>

                    <div class="seekBar">
                        <div class="circle"></div>
                    </div>

                    <div class="songTotalTime">00:00</div>
                </div>
            </div>

            <div class="volume flex justify-center align-items-center pointer">
                <img src="Assets/HiVolume.svg" alt="Volume" class="vol-icon">
                <input class="pointer volume-range" type="range" name="volumeBar" min="0" max="100" value="50">
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>

</html>
