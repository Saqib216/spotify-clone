<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 44" width="210" height="44">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- SoundPulse Mark Badge -->
  <rect x="4" y="4" width="36" height="36" rx="10" fill="url(#pulseGrad)" filter="url(#glow)"/>
  
  <!-- Equalizer wave lines inside badge -->
  <line x1="13" y1="22" x2="13" y2="22" stroke="#090D16" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="16" x2="18" y2="28" stroke="#090D16" stroke-width="3" stroke-linecap="round"/>
  <line x1="23" y1="11" x2="23" y2="33" stroke="#090D16" stroke-width="3" stroke-linecap="round"/>
  <line x1="28" y1="17" x2="28" y2="27" stroke="#090D16" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Full SoundPulse Wordmark with full margin -->
  <text x="48" y="29" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.2">Sound<tspan fill="#00E5FF">Pulse</tspan></text>
</svg>